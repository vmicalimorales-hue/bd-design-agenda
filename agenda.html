<title>BD Barcelona — Design Agenda · Interactive</title>
<style>
  :root{
    --ink:#1a1a1a; --soft:#5c5c5c; --muted:#9a948b; --paper:#fff;
    --canvas:#f1efea; --hair:#e7e3dc; --rule:#1a1a1a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--ink);
       font-family:'Helvetica Neue',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:34px 16px 80px;}
  .sheet{background:var(--paper);position:relative;}
  .updated{position:absolute;top:14px;right:16px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.4;}
  .warn{font-size:11px;color:#b45309;margin-top:6px;letter-spacing:.2px;}
  /* masthead */
  .mast{padding:46px 44px 30px;text-align:center;border-bottom:1px solid var(--hair);}
  .mast img{width:52px;height:52px}
  .mast .bcn{font-size:12px;letter-spacing:7px;font-weight:600;margin-top:10px}
  .mast .dash{width:34px;height:1px;background:var(--ink);margin:20px auto}
  .mast h1{font-size:30px;font-weight:200;letter-spacing:1.5px;margin:0}
  .mast .sub{font-size:11px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;margin-top:12px}
  .mast .ed{font-size:11px;letter-spacing:3px;font-weight:600;margin-top:18px}
  /* controls */
  .controls{position:sticky;top:0;z-index:5;background:var(--paper);
            padding:18px 44px;border-bottom:1px solid var(--hair);}
  .search{width:100%;border:none;border-bottom:1px solid var(--ink);background:transparent;
          font-family:inherit;font-size:18px;font-weight:200;color:var(--ink);
          padding:8px 2px;letter-spacing:.3px;outline:none;}
  .search::placeholder{color:var(--muted);font-weight:300}
  .filtrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:16px}
  .flabel{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
          font-weight:600;margin-right:4px}
  .chip{font-size:11px;letter-spacing:.6px;padding:6px 13px;border:1px solid var(--hair);
        background:var(--paper);color:var(--soft);cursor:pointer;border-radius:18px;
        transition:.12s;user-select:none;white-space:nowrap;}
  .chip:hover{border-color:var(--muted)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.star.on{background:var(--ink);color:#fff}
  .sep{flex-basis:100%;height:0}
  .meta{display:flex;justify-content:space-between;align-items:baseline;
        padding:16px 44px 0;font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
  .views{display:flex;gap:4px}
  .vbtn{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:5px 11px;
        border:1px solid var(--hair);background:var(--paper);color:var(--soft);cursor:pointer}
  .vbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* list */
  .list{padding:6px 44px 30px}
  .ghead{display:flex;justify-content:space-between;align-items:baseline;
         border-top:2px solid var(--rule);padding-top:12px;margin-top:38px}
  .ghead h2{font-size:21px;font-weight:300;letter-spacing:1.4px;text-transform:uppercase;margin:0}
  .ghead .gn{font-size:11px;color:var(--muted);letter-spacing:1px}
  .chead{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
         margin:22px 0 2px}
  .ev{padding:18px 0;border-bottom:1px solid var(--hair);}
  .ev .ty{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .ev .nm{font-size:17px;font-weight:500;letter-spacing:.2px;line-height:1.4;margin-top:7px}
  .ev .nm .st{display:inline-block;margin-right:7px}
  .ev .mt{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:6px 0 9px}
  .ev .nt{font-size:13px;color:var(--soft);line-height:1.65;max-width:620px}
  .ev a.src{display:inline-block;margin-top:9px;font-size:11px;letter-spacing:.3px;
            color:var(--soft);text-decoration:none;border-bottom:1px solid var(--hair)}
  .ev .pill{display:inline-block;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
            border:1px solid var(--hair);color:var(--muted);padding:2px 7px;border-radius:9px;margin-left:8px;vertical-align:middle}
  .empty{padding:70px 0;text-align:center;color:var(--muted);font-size:14px;letter-spacing:.5px}
  .foot{border-top:2px solid var(--rule);padding:26px 44px;text-align:center}
  .foot img{width:28px;height:28px}
  .foot .bcn{font-size:11px;letter-spacing:5px;font-weight:600;margin-top:8px}
  .foot .fn{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:10px;line-height:1.7}
  @media (max-width:560px){
    .mast,.controls,.meta,.list,.foot{padding-left:20px;padding-right:20px}
  }
</style></head>

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

document.getElementById('edlabel').textContent = (META.edition||'').toUpperCase();

const state = {
  q:'', regions:new Set(), types:new Set(), starOnly:false, view:'region'
};

const regionOrder = META.region_order && META.region_order.length
  ? META.region_order.slice() : [...new Set(DATA.map(e=>e.region))];
const typeOrder = [...new Set(DATA.map(e=>e.type))];

// build chips
function mkChip(label, set, value, container){
  const c = document.createElement('span');
  c.className='chip'; c.textContent=label;
  c.onclick=()=>{ if(set.has(value)){set.delete(value);c.classList.remove('on');}
                  else{set.add(value);c.classList.add('on');} render(); };
  container.appendChild(c);
}
regionOrder.forEach(r=>mkChip(r, state.regions, r, document.getElementById('regionchips')));
typeOrder.forEach(t=>mkChip(t, state.types, t, document.getElementById('typechips')));

document.getElementById('q').addEventListener('input', e=>{state.q=e.target.value.toLowerCase();render();});
const starchip=document.getElementById('starchip');
starchip.onclick=()=>{state.starOnly=!state.starOnly; starchip.classList.toggle('on',state.starOnly); render();};
document.getElementById('clearchip').onclick=()=>{
  state.q=''; document.getElementById('q').value='';
  state.regions.clear(); state.types.clear(); state.starOnly=false;
  document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
  render();
};
document.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.view=b.dataset.v; render();
});

function matches(e){
  if(state.starOnly && !e.star) return false;
  if(state.regions.size && !state.regions.has(e.region)) return false;
  if(state.types.size && !state.types.has(e.type)) return false;
  if(state.q){
    const hay=(e.name+' '+e.city+' '+e.country+' '+e.region+' '+e.note+' '+e.type).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

function evHtml(e){
  const star = e.star ? '<span class="st">'+STARMARK+'</span>' : '';
  const isTbc = (e.dates||'').toLowerCase().includes('tbc');
  const pill = isTbc ? '<span class="pill">date TBC</span>' : '';
  const warn = isTbc ? '<div class="warn">&#9888; Date not confirmed yet — tentative, not reliable until the organiser publishes it.</div>' : '';
  const web = e.web ? '<a class="src" href="'+e.web+'" target="_blank" rel="noopener">'+
              e.web.replace(/^https?:\/\//,'').replace(/\/$/,'')+'</a>' : '';
  return '<div class="ev">'+
    '<div class="ty">'+e.type+'</div>'+
    '<div class="nm">'+star+e.name+pill+'</div>'+
    '<div class="mt">'+e.city+' &middot; '+e.country+' &middot; '+e.dates+'</div>'+
    '<div class="nt">'+e.note+'</div>'+warn+web+'</div>';
}

function groupHead(title,n){
  return '<div class="ghead"><h2>'+title+'</h2><span class="gn">'+n+' EVENTS</span></div>';
}

function render(){
  const rows = DATA.filter(matches);
  const list=document.getElementById('list');
  document.getElementById('count').textContent =
    rows.length+' of '+DATA.length+' events'+(state.starOnly?' · key only':'');
  if(!rows.length){ list.innerHTML='<div class="empty">No events match these filters.</div>'; return; }

  let html='';
  if(state.view==='region'){
    regionOrder.forEach(r=>{
      const inR=rows.filter(e=>e.region===r);
      if(!inR.length) return;
      html+=groupHead(r,inR.length);
      const countries=[...new Set(inR.map(e=>e.country))];
      countries.forEach(c=>{
        const inC=inR.filter(e=>e.country===c).sort((a,b)=>a.orden.localeCompare(b.orden));
        html+='<div class="chead">'+c+'</div>';
        inC.forEach(e=>html+=evHtml(e));
      });
    });
  } else {
    const sorted=rows.slice().sort((a,b)=>a.orden.localeCompare(b.orden));
    let curKey='';
    sorted.forEach(e=>{
      const y=e.orden.slice(0,4), m=parseInt(e.orden.slice(4,6),10)-1;
      const key=y+'-'+m;
      if(key!==curKey){
        curKey=key;
        const inM=sorted.filter(x=>x.orden.slice(0,4)===y && (parseInt(x.orden.slice(4,6),10)-1)===m);
        html+=groupHead(MONTHS[m]+' '+y, inM.length);
      }
      html+=evHtml(e);
    });
  }
  list.innerHTML=html;
}
render();
</script>
